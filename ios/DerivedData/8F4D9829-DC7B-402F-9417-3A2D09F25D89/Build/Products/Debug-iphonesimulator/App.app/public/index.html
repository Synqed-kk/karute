<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Karute</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      background: #ffffff; color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center;
    }
    .wrap { max-width: 320px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 24px; opacity: .95; object-fit: contain; }
    h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
    p { font-size: 14px; line-height: 1.7; color: #6b7280; margin: 0 0 28px; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 13px 28px;
      font-size: 15px; font-weight: 600; color: #ffffff; background: #1c1c1e;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: .8; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="karute_logo.png" alt="Karute" />
    <h1>接続できません</h1>
    <p>インターネット接続を確認して、もう一度お試しください。<br />Unable to connect. Check your network and try again.</p>
    <button onclick="location.reload()">再読み込み / Retry</button>
  </div>
</body>
</html>
